name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint

      - name: Shellcheck (semua script .sh)
        run: |
          shellcheck setup/*.sh tools/*.sh 2>/dev/null || \
          shellcheck $(find . -name '*.sh' -not -path './.git/*') || true

      - name: YAML lint (playbook & monitoring)
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
            setup/deploy-edge.yml \
            monitoring/prometheus/prometheus.yml \
            monitoring/grafana/provisioning/datasources/prometheus.yml \
            monitoring/grafana/provisioning/dashboards/dashboards.yml || true

      - name: Python syntax check
        run: python3 -m py_compile tools/gen-cdb.py

  test-gen-cdb:
    name: Smoke test gen-cdb.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate & verify CDB
        run: |
          python3 tools/gen-cdb.py /tmp/blacklist.db evil.com blocked.domain. example.com
          python3 - <<'EOF'
          import struct

          # CDB spec (cr.yp.to/cdb/cdb.txt), as implemented by dnsdist and
          # github.com/colinmarc/cdb:
          #   - header = 256 entries of (tableOffset uint32, slotCount uint32)
          #   - bucket is chosen by the LOW byte of the hash: h & 0xFF
          #   - the second header field is a SLOT COUNT, not a byte count
          #   - probing starts at (h >> 8) % slotCount and walks forward
          #   - keys are DNS wire format (KeyValueLookupKeyQName(true))
          # An earlier version of this smoke test asserted the previous buggy
          # layout ((h >> 8) & 0xFF buckets, byte-count field, plain-text keys),
          # which made it fail against the corrected generator.
          data = open('/tmp/blacklist.db','rb').read()
          assert len(data) >= 2048
          for i in range(256):
              pos, n = struct.unpack('<II', data[i*8:i*8+8])
              assert pos >= 2048 and pos + n*8 <= len(data), f"header slot {i} rusak"

          def chash(b):
              h = 5381
              for c in b: h = ((h + (h << 5)) & 0xFFFFFFFF) ^ c
              return h & 0xFFFFFFFF

          def wire(name):
              out = bytearray()
              for label in name.split('.'):
                  out.append(len(label)); out += label.encode()
              out.append(0)
              return bytes(out)

          for name in ['evil.com', 'blocked.domain', 'example.com']:
              key = wire(name)
              h = chash(key)
              idx = h & 0xFF
              pos, n = struct.unpack('<II', data[idx*8:idx*8+8])
              assert n > 0, f"bucket {idx} kosong untuk {name}"
              hit = False
              start = (h >> 8) % n
              for i in range(n):
                  off = pos + ((start + i) % n)*8
                  th, tpos = struct.unpack('<II', data[off:off+8])
                  if th == 0: break
                  if th != h: continue
                  klen, _ = struct.unpack('<II', data[tpos:tpos+8])
                  if data[tpos+8:tpos+8+klen] == key: hit = True; break
              assert hit, f"lookup gagal: {name}"
          print("CDB smoke test PASS")
          EOF

  test-go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: |
            panel/go.sum
            tools/rpz-master/go.sum
      - name: Test panel
        working-directory: panel
        run: go test -race ./...
      - name: Test RPZ master
        working-directory: tools/rpz-master
        run: |
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/rpz-master" .

  test-shell:
    name: Shell regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n setup/setup-edge.sh setup/setup-master.sh setup/update-blacklist.sh
          bash -n tests/*.sh
      - name: Install Lua 5.1 (setup-edge-webserver-escape.sh)
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run regression tests
        run: |
          for test_file in tests/*.sh; do
            bash "$test_file"
          done
          for test_file in tools/test-*.sh; do
            bash "$test_file"
          done
