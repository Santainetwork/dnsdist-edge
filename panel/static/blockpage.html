<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akses Diblokir — Trust+</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b1220;
    color: #e6e9ef;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    max-width: 520px;
    width: 100%;
    background: #111a2c;
    border: 1px solid #223047;
    border-radius: 16px;
    padding: 40px 36px;
    text-align: center;
  }
  .shield {
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 1.5rem; margin-bottom: 10px; color: #f8fafc; }
  p  { font-size: .95rem; line-height: 1.6; color: #94a3b8; }
  .domain {
    font-family: ui-monospace, monospace;
    background: #0b1220;
    border: 1px solid #223047;
    padding: 6px 12px;
    border-radius: 8px;
    color: #fbbf24;
    word-break: break-all;
    display: inline-block;
    margin: 12px 0 4px;
  }
  .footer { margin-top: 28px; font-size: .8rem; color: #475569; }
</style>
</head>
<body>
<main class="card">
  <div class="shield">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
  </div>
  <h1>Akses Diblokir</h1>
  <p>Situs ini diblokir sesuai kebijakan Trust Positif.</p>
  <span class="domain">{{domain}}</span>
  <p>Jika Anda merasa ini keliru, hubungi administrator jaringan Anda.</p>
  <div class="footer">Trust-NG Edge Node</div>
</main>
</body>
</html>
